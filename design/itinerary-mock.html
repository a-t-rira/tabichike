<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>たびチケ 旅程タブ見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<!--
  ============================================================
  たびチケ 旅行詳細の共通枠（S3）＋ 旅程タブ（S4）デザイン見本
  - 見た目・余白・文字サイズ・アニメーションはこのファイルを正とする
  - デザイントークンは design/home-mock.html と共通
  - データはダミー。「今」は2日目の11:00として固定表示している
    （実装では現在時刻から、今日の予定のうち開始時刻が今以降で最も早いものに NEXT を付ける）
  - 一番下の「見本用」パネルは確認用。アプリには実装しない
  ============================================================
-->
<style>
:root {
  --c-navy: #1B2A4A;
  --c-paper: #FBF7EE;
  --c-white: #FFFFFF;
  --c-gray: #7A7F8C;
  --c-line: #E3DCCB;
  --c-sunset: #FF6B3D;
  --c-sky: #3BA7E0;
  --c-mint: #2EC4A6;
  --c-rose: #F2668B;
  --c-gold: #C9A227;
  --c-stamp: #D7263D;
  --c-board: #10192E;
  --c-board-text: #FFC93C;
  --tc: var(--c-sunset);   /* この旅行のチケット色 */
  --f-ja: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-en: "Bebas Neue", "Arial Narrow", sans-serif;
  --f-num: "Space Mono", ui-monospace, monospace;
  /* カテゴリ色 */
  --cat-move: #3BA7E0;
  --cat-sight: #FF6B3D;
  --cat-food: #E8A317;
  --cat-stay: #7B6CD9;
  --cat-other: #7A7F8C;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--f-ja);
  color: var(--c-navy);
  background-color: var(--c-paper);
  background-image: radial-gradient(rgba(27, 42, 74, .07) 1px, transparent 1.3px);
  background-size: 18px 18px;
  min-height: 100vh;
  padding-bottom: calc(120px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.wrap { max-width: 480px; margin: 0 auto; padding: 0 16px; }

/* ---------- ヘッダー ---------- */
.top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 64px; gap: 8px; }
.top h1 { font-size: 17px; font-weight: 900; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--c-white); box-shadow: 0 2px 8px rgba(27,42,74,.08); transition: transform .15s; }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 22px; height: 22px; }

/* ---------- サマリー帯 ---------- */
.summary {
  display: flex; align-items: center; gap: 10px;
  background: var(--c-white); border-radius: 14px; padding: 12px 14px;
  box-shadow: 0 4px 12px rgba(27,42,74,.06);
}
.summary .pin { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 10px; background: var(--tc); color: #fff; }
.summary .pin svg { width: 18px; height: 18px; }
.summary .txt { min-width: 0; flex: 1; }
.summary .dest { font-weight: 900; font-size: 16px; line-height: 1.2; }
.summary .meta { font-family: var(--f-num); font-size: 12px; color: var(--c-gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.summary .meta span { font-family: var(--f-ja); }
.pill { flex: none; font-size: 12px; font-weight: 900; padding: 5px 10px; border-radius: 999px; }
.pill.now { background: var(--c-rose); color: #fff; }

/* ---------- タブ（チケットの見出し風） ---------- */
.tabs-bar { position: sticky; top: 0; z-index: 5; background: var(--c-paper); padding-top: 14px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-bottom: 2px solid var(--c-white); }
.tab {
  position: relative; height: 46px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-weight: 700; font-size: 15px; color: var(--c-gray);
  border-radius: 12px 12px 0 0;
}
.tab small { font-family: var(--f-num); font-size: 11px; font-weight: 700; }
.tab[aria-selected="true"] { background: var(--c-white); color: var(--c-navy); box-shadow: 0 -4px 10px rgba(27,42,74,.05); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--tc); }

/* ---------- 日ブロック ---------- */
.day { margin-top: 26px; }
.day-head { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 12px; position: relative; min-height: 44px; }
.day-no { display: flex; align-items: flex-end; gap: 3px; font-family: var(--f-en); line-height: .85; }
.day-no .k { font-size: 18px; letter-spacing: .08em; color: var(--c-gray); padding-bottom: 3px; }
.day-no .n { font-size: 44px; color: var(--c-navy); }
.day.is-today .day-no .n { color: var(--tc); }
.day-date { font-family: var(--f-num); font-weight: 700; font-size: 14px; padding-bottom: 4px; }
.day-date small { font-family: var(--f-ja); font-size: 12px; }
.today-badge { font-size: 11px; font-weight: 900; background: var(--tc); color: #fff; padding: 3px 8px; border-radius: 999px; margin-bottom: 5px; }
.day-complete {
  position: absolute; right: 2px; bottom: 0;
  border: 2.5px solid var(--c-stamp); border-radius: 6px;
  color: var(--c-stamp); padding: 3px 8px 2px;
  font-family: var(--f-en); font-size: 16px; letter-spacing: .08em; line-height: 1;
  box-shadow: inset 0 0 0 2px var(--c-paper), inset 0 0 0 3.5px var(--c-stamp);
  transform: rotate(-8deg); opacity: .9;
}

/* ---------- タイムライン ---------- */
.timeline { position: relative; display: grid; gap: 10px; }
.timeline::before { /* 飛行ルート風の点線 */
  content: ""; position: absolute; left: 67px; top: 18px; bottom: 18px; width: 2px;
  background: repeating-linear-gradient(180deg, rgba(27,42,74,.22) 0 5px, transparent 5px 10px);
}
.item { display: grid; grid-template-columns: 48px 40px 1fr; align-items: start; gap: 0; }
.time { font-family: var(--f-num); font-weight: 700; font-size: 14px; line-height: 1.15; padding-top: 11px; text-align: right; padding-right: 2px; }
.time small { display: block; font-size: 11px; font-weight: 400; color: var(--c-gray); }
.time.tbd { font-family: var(--f-ja); font-size: 11px; color: var(--c-gray); padding-top: 13px; }
.pin-col { display: flex; justify-content: center; padding-top: 4px; position: relative; }
.cat {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--c-white); color: var(--cc);
  box-shadow: 0 0 0 2px var(--c-paper), 0 2px 6px rgba(27,42,74,.12);
  position: relative; z-index: 1;
}
.cat svg { width: 18px; height: 18px; }
.is-next .cat { background: var(--tc); color: #fff; box-shadow: 0 0 0 2px var(--c-paper), 0 0 0 5px color-mix(in srgb, var(--tc) 30%, transparent); }
.card {
  position: relative;
  background: var(--c-white); border-radius: 14px;
  padding: 10px 56px 11px 13px;
  min-height: 62px;
  box-shadow: 0 3px 10px rgba(27,42,74,.07);
  cursor: pointer;
  border-left: 3px solid var(--cc);
}
.card:active { transform: scale(.99); }
.is-next .card { box-shadow: 0 6px 16px rgba(255,107,61,.18); }
.next-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--f-en); font-size: 13px; letter-spacing: .1em; line-height: 1;
  color: var(--tc); margin-bottom: 4px;
}
.next-tag svg { width: 13px; height: 13px; }
.c-title { font-weight: 900; font-size: 15px; line-height: 1.35; display: flex; align-items: center; gap: 6px; }
.c-title .check { width: 16px; height: 16px; flex: none; color: var(--c-stamp); }
.c-place { font-size: 12px; color: var(--c-gray); margin-top: 2px; display: flex; align-items: center; gap: 3px; }
.c-place svg { width: 12px; height: 12px; flex: none; }
.c-memo { font-size: 12px; color: #4A5570; margin-top: 6px; padding: 6px 8px; background: var(--c-paper); border-radius: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 「行った？」ボタンとスタンプ */
.stamp-slot { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; }
.go-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1.5px dashed rgba(215, 38, 61, .55);
  color: var(--c-stamp); font-size: 10px; font-weight: 900; line-height: 1.1;
  display: grid; place-items: center; text-align: center;
  background: #FFF6F7;
}
.go-btn:active { transform: scale(.94); }
.visited {
  width: 54px; height: 54px; margin: -5px;
  border-radius: 50%;
  border: 2.5px solid var(--c-stamp);
  box-shadow: inset 0 0 0 2.5px var(--c-white), inset 0 0 0 4px var(--c-stamp);
  color: var(--c-stamp);
  display: grid; place-content: center; text-align: center;
  font-family: var(--f-en); font-size: 13px; letter-spacing: .02em; line-height: 1; white-space: nowrap;
  transform: rotate(-12deg); opacity: .9;
  cursor: pointer;
}
.visited span { font-family: var(--f-num); font-size: 8px; font-weight: 700; margin-top: 2px; }
.press { animation: press .35s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes press { from { transform: rotate(-12deg) scale(1.8); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: .9; } }
.day-complete.press { animation-name: pressDay; }
@keyframes pressDay { from { transform: rotate(-8deg) scale(1.8); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: .9; } }

/* 予定0件の日 */
.empty-day { margin-left: 88px; border: 1.5px dashed var(--c-line); border-radius: 14px; padding: 14px; text-align: center; font-size: 13px; color: var(--c-gray); background: rgba(255,255,255,.5); }
.empty-day button { margin-top: 8px; font-weight: 700; font-size: 13px; color: var(--c-navy); padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--c-navy); background: var(--c-white); display: inline-flex; align-items: center; gap: 4px; }
.empty-day button svg { width: 14px; height: 14px; }

/* しおりボタン */
.shiori-btn {
  margin-top: 32px; width: 100%; height: 54px; border-radius: 999px;
  background: var(--c-navy); color: #fff; font-weight: 900; font-size: 15px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 6px 16px rgba(27,42,74,.25);
}
.shiori-btn .mini-pass { width: 22px; height: 28px; border-radius: 4px; background: var(--c-gold); position: relative; }
.shiori-btn .mini-pass::after { content: ""; position: absolute; inset: 8px 5px; border: 1.5px solid var(--c-navy); border-radius: 50%; }
.shiori-btn:active { transform: scale(.98); }

/* ---------- FAB ---------- */
.fab {
  position: fixed; z-index: 10;
  right: max(16px, calc((100vw - 480px) / 2 + 16px));
  bottom: calc(24px + env(safe-area-inset-bottom));
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--c-sunset); color: #fff;
  display: grid; place-items: center;
  box-shadow: 0 8px 20px rgba(255, 107, 61, .4), 0 2px 0 rgba(27,42,74,.15);
}
.fab:active { transform: scale(.94); }
.fab svg { width: 28px; height: 28px; }

/* ---------- 見本用（実装しない） ---------- */
.mock { margin-top: 32px; padding: 12px; border: 1.5px dashed var(--c-gray); border-radius: 12px; font-size: 12px; color: var(--c-gray); line-height: 1.6; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <button class="icon-btn" aria-label="戻る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1>京都ひとり旅</h1>
    <button class="icon-btn" aria-label="メニュー">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </header>

  <div class="summary">
    <div class="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
    <div class="txt">
      <div class="dest">京都</div>
      <div class="meta" id="meta"></div>
    </div>
    <span class="pill now">旅行中！</span>
  </div>

  <div class="tabs-bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true">旅程 <small>12</small></button>
      <button class="tab" role="tab" aria-selected="false">持ち物 <small>18/20</small></button>
      <button class="tab" role="tab" aria-selected="false">費用</button>
    </div>
  </div>

  <div id="days"></div>

  <button class="shiori-btn"><span class="mini-pass"></span>しおりを見る</button>

  <div class="mock">
    見本用メモ（実装しない）：「行った？」を押すとスタンプが押され、もう一度押すと外れる。2日目の残りを全部押すと DAY COMPLETE が押される。3日目は未来の日なので「行った？」は出ない。
  </div>
</div>

<button class="fab" aria-label="予定を追加">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const WD = ['日','月','火','水','木','金','土'];
const addDays = (n) => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + n); return d; };
const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
const wd = (d) => `(${WD[d.getDay()]})`;

// カテゴリのアイコン（線画）と色
const CAT = {
  move:  { c: 'var(--cat-move)',  i: '<path d="M8 3h8a4 4 0 0 1 4 4v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a4 4 0 0 1 4-4Z"/><path d="M4 11h16M8 21l2-4M16 21l-2-4"/><circle cx="8" cy="14" r=".6" fill="currentColor"/><circle cx="16" cy="14" r=".6" fill="currentColor"/>' },
  sight: { c: 'var(--cat-sight)', i: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3.5"/>' },
  food:  { c: 'var(--cat-food)',  i: '<path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2M6 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>' },
  stay:  { c: 'var(--cat-stay)',  i: '<path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/>' },
  other: { c: 'var(--cat-other)', i: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>' },
};

// ダミーデータ：2日目が今日
const start = addDays(-1);
const days = [
  { date: addDays(-1), items: [
    { id: 1, time: '08:12', end: '10:28', cat: 'move', title: 'のぞみ 209号で京都へ', place: '東京駅 → 京都駅', done: true },
    { id: 2, time: '11:00', end: null, cat: 'food', title: 'にしんそば', place: '四条', memo: '人気店なので早めに', done: true },
    { id: 3, time: '13:30', end: '16:00', cat: 'sight', title: '清水寺', place: '東山区', done: true },
    { id: 4, time: '18:00', end: null, cat: 'stay', title: '町家の宿にチェックイン', place: '祇園', done: true },
  ]},
  { date: addDays(0), items: [
    { id: 5, time: '08:30', end: null, cat: 'food', title: '宿で朝ごはん', place: '', done: true },
    { id: 6, time: '09:30', end: '11:00', cat: 'sight', title: '伏見稲荷大社', place: '伏見区', done: true },
    { id: 7, time: '12:00', end: null, cat: 'food', title: '錦市場で食べ歩き', place: '中京区', memo: '出汁巻き・豆乳ドーナツは必食', done: false, next: true },
    { id: 8, time: '15:00', end: '17:00', cat: 'sight', title: '嵐山・竹林の小径', place: '右京区', done: false },
    { id: 9, time: null, end: null, cat: 'other', title: 'おみやげを買う', place: '', memo: '会社用にお菓子 2箱', done: false },
  ]},
  { date: addDays(1), items: [
    { id: 10, time: '10:00', end: null, cat: 'sight', title: '金閣寺', place: '北区', done: false },
    { id: 11, time: '13:00', end: null, cat: 'food', title: '湯葉ランチ', place: '', done: false },
    { id: 12, time: '17:20', end: '19:33', cat: 'move', title: 'のぞみで帰る', place: '京都駅 → 東京駅', done: false },
  ]},
];
const today = addDays(0);

document.getElementById('meta').innerHTML =
  `${md(days[0].date)}<span>${wd(days[0].date)}</span> → ${md(days[2].date)}<span>${wd(days[2].date)}</span> · <span>2泊3日</span>`;

const svg = (p, sw = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

function itemHTML(it, dayDate) {
  const c = CAT[it.cat];
  const canStamp = dayDate <= today;
  const time = it.time
    ? `<div class="time">${it.time}${it.end ? `<small>〜${it.end}</small>` : ''}</div>`
    : `<div class="time tbd">未定</div>`;
  let slot = '';
  if (canStamp) {
    slot = it.done
      ? `<div class="visited" data-id="${it.id}" role="button" aria-label="スタンプを外す">VISITED<span>${md(dayDate)}</span></div>`
      : `<button class="go-btn" data-id="${it.id}" aria-label="行った！スタンプを押す">行った？</button>`;
  }
  return `
  <div class="item ${it.next ? 'is-next' : ''}" style="--cc:${c.c}">
    ${time}
    <div class="pin-col"><span class="cat">${svg(c.i)}</span></div>
    <div class="card">
      ${it.next ? `<div class="next-tag">${svg('<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>', 2.2)}NEXT</div>` : ''}
      <div class="c-title">${it.title}${it.done ? `<span class="check">${svg('<path d="M20 6 9 17l-5-5"/>', 3)}</span>` : ''}</div>
      ${it.place ? `<div class="c-place">${svg('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>')}${it.place}</div>` : ''}
      ${it.memo ? `<div class="c-memo">${it.memo}</div>` : ''}
      <div class="stamp-slot">${slot}</div>
    </div>
  </div>`;
}

function render(pressedId, dayPressed) {
  document.getElementById('days').innerHTML = days.map((d, i) => {
    const isToday = +d.date === +today;
    const all = d.items.length > 0 && d.items.every(x => x.done);
    const items = [...d.items].sort((a, b) => (a.time ?? '99') < (b.time ?? '99') ? -1 : 1);
    return `
    <section class="day ${isToday ? 'is-today' : ''}" data-day="${i}">
      <div class="day-head">
        <div class="day-no"><span class="k">DAY</span><span class="n">${i + 1}</span></div>
        <div class="day-date">${md(d.date)}<small>${wd(d.date)}</small></div>
        ${isToday ? '<span class="today-badge">今日</span>' : ''}
        ${all ? `<span class="day-complete ${dayPressed === i ? 'press' : ''}" ${dayPressed === i ? 'style="animation-delay:.75s"' : ''}>DAY COMPLETE</span>` : ''}
      </div>
      ${items.length
        ? `<div class="timeline">${items.map(it => itemHTML(it, d.date)).join('')}</div>`
        : `<div class="empty-day">予定はまだありません<br><button>${svg('<path d="M12 5v14M5 12h14"/>', 2.6)}この日に追加</button></div>`}
    </section>`;
  }).join('');
  if (pressedId != null && !reduce) {
    const el = document.querySelector(`.visited[data-id="${pressedId}"]`);
    if (el) el.classList.add('press');
  }
}

document.getElementById('days').addEventListener('click', (e) => {
  const t = e.target.closest('.go-btn, .visited');
  if (!t) return;
  e.stopPropagation();
  const id = +t.dataset.id;
  const di = days.findIndex(d => d.items.some(x => x.id === id));
  const it = days[di].items.find(x => x.id === id);
  const wasAll = days[di].items.every(x => x.done);
  it.done = !it.done;
  const nowAll = days[di].items.every(x => x.done);
  render(it.done ? id : null, (!wasAll && nowAll) ? di : null);
});

render();
</script>
</body>
</html>
